[package]
name = "monty-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
monty = { git = "https://github.com/pydantic/monty.git", tag = "v0.0.23" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
monty-types = { git = "https://github.com/pydantic/monty.git", tag = "v0.0.23" }
monty-alloc = { git = "https://github.com/pydantic/monty.git", tag = "v0.0.23" }
# Needed to parse an arbitrary-precision int a host sends across the JSON
# boundary as a digit string (MontyObject::BigInt). Already in the lock file
# via monty itself.
num-bigint = "0.4"
base64 = "0.22"
